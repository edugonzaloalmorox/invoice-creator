[project]
name = "invoice-filler-backend"
version = "0.1.0"
description = "Backend scaffold for the invoice filler MVP"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth>=2.59.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
